spring.application.name=meari

# Database Configuration (Environment variable driven with safe H2 default)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:meari_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${POSTGRES_USER:sa}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Local AI & Storage Endpoints (Environment variable driven)
meari.ai.whisper-url=${WHISPER_API_URL:http://localhost:8000}
meari.ai.ollama-url=${OLLAMA_API_URL:http://localhost:11434}
meari.ai.ollama-model=${OLLAMA_MODEL:gemma2:2b}
meari.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
meari.storage.bucket=${MINIO_BUCKET:meari-media}
